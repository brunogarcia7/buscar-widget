name: Build e publicar APK

# Dispara quando você cria uma tag de versão, ex.: v1.0.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para criar o Release e anexar o APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner ubuntu-latest já vem com o Android SDK pré-instalado, então
      # não precisamos da action setup-android (que falhava tentando instalar
      # o pacote 'tools', já descontinuado). O Gradle usa o SDK do ANDROID_HOME.

      - name: Restaurar a keystore a partir do secret
        # O secret KEYSTORE_BASE64 contém a keystore em base64. Ele é decodificado
        # para um arquivo temporário usado só durante o build.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > buscar-widget-release.jks
          cat > keystore.properties <<EOF
          storeFile=buscar-widget-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Build do APK release assinado
        run: ./gradlew assembleRelease --no-daemon

      - name: Renomear o APK com a versão da tag
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BuscarWidget-${GITHUB_REF_NAME}.apk"

      - name: Publicar no Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BuscarWidget-*.apk
          generate_release_notes: true

      - name: Limpar segredos do runner
        if: always()
        run: rm -f buscar-widget-release.jks keystore.properties
